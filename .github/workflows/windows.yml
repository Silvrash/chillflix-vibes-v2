# Builds the Windows installer. A Windows NSIS installer has to be built on
# Windows, and the repo is developed on a Mac, so this runner is the build
# machine.
#
# Two modes, decided by what triggered it:
#   - a push touching windows/ or this file, or a manual run: builds and keeps
#     the installer as a workflow artifact — a check that it still builds, and
#     a copy to try, published nowhere.
#   - a pushed tag `windows-v*`: builds and attaches the installer to a GitHub
#     release for that tag. Tagging is the act of publishing, and it is deliberate.
name: windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
    tags:
      - 'windows-v*'

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './windows/src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      # The site is the frontend, so there is nothing to build before Tauri
      # runs — only the shell, and the installer around it.
      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/windows-v') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: windows
          uploadWorkflowArtifacts: true

      - name: Build installer and publish the release
        if: ${{ startsWith(github.ref, 'refs/tags/windows-v') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: windows
          tagName: ${{ github.ref_name }}
          releaseName: 'ChillFlixVibes for Windows ${{ github.ref_name }}'
          releaseBody: |
            The installer is not signed, so Windows shows "Windows protected your PC" the first time.
            Choose "More info", then "Run anyway". It only asks once.
          releaseDraft: false
          prerelease: false
